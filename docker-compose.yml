version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ner_user
      POSTGRES_PASSWORD: ner_password
      POSTGRES_DB: ner_logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ner_user:ner_password@postgres:5432/ner_logistics
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: npm start

volumes:
  postgres_data: